[package]
name = "oyasumivr"
version = "26.8.0-beta.5"
description = ""
authors = ["Raphiiko"]
license = "MIT"
repository = "https://github.com/Raphiiko/Oyasumi"
default-run = "oyasumivr"
edition = "2021"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-updater = "2.10.1"

[dependencies]
async-recursion = "1.1.1"
base64 = "0.22.1"
btleplug = "0.12.0"
byteorder = "1.5.0"
bytes = "1.12.1"
chrono = "0.4.45"
cronjob = "0.4.17"
dirs = "6.0.0"
discord-sdk = "0.4.0"
enumset = "1.1.14"
futures = "0.3.33"
futures-util = "0.3.33"
hidapi = "2.6.6"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
log = { version = "0.4.33", features = ["release_max_level_info"] }
md5 = "0.8.1"
mime = "0.3.17"
mime_guess = "2.0.5"
nalgebra = "0.35.0"
named_pipe = "0.4.1"
oyasumivr-shared = { path = "../src-shared-rust" }
prost = "0.14.4"
public-ip = "0.2.2"
readonly = "0.2.14"
regex = "1.13.1"
sentry = { version = "0.49.1", default-features = false }
reqwest = "0.13.4"
rodio = "0.22.2"
rosc = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
steamlocate = "2.1.0"
steamworks = { version = "0.13.1", features = ["raw-bindings"] }
strum = "0.28.0"
strum_macros = "0.28.0"
substring = "1.4.5"
suncalc = "0.4.0"
sysinfo = "0.39.6"
system_shutdown = "4.1.0"
tauri-plugin-aptabase = { git = "https://github.com/aptabase/tauri-plugin-aptabase", rev = "7cc36ccce0052352bda7272a4acb25a214c4b804" }
tauri-plugin-cli = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-http = { version = "2.5.9", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration", "unsafe-headers"] }
tauri-plugin-log = { version = "2.9.0" }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-store = "2.4.4"
tempfile = "3.27.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["full"] }
tokio-util = "0.7.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.24.0", features = [
    "v4",
] }
webview2-com = "0.39.1"
widestring = "1.2.1"
windows-core = { version = "0.62.2", default-features = false }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Devices_FunctionDiscovery", 
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Console",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Devices_Radios",
], default-features = false }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }
winreg = "0.56.0"

[dependencies.ipgeolocate]
git = "https://github.com/Raphiiko/ipgeolocate_oyasumi.git"
rev = "5f24925"

[dependencies.ovr_overlay]
git = "https://github.com/Raphiiko/ovr_overlay_oyasumi"
rev = "f7b58630b53df4ae671f8c52e7b457a0213e95b7"
# path = "../../ovr_overlay_oyasumi"
features = ["ovr_system", "ovr_settings"]

[dependencies.oyasumivr_oscquery]
git = "https://github.com/Raphiiko/oyasumivr_oscquery.git"
rev = "47c00b5fab8d7a45ba3254873ca7886f84483560"
# path = "../../oyasumivr_oscquery"

[dependencies.tauri]
version = "2.11.5"
features = ["tray-icon"]

[build-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }
tauri-build = { version = "2.6.3", features = [] }
toml = "1.1.4"
tonic-prost-build = { version = "0.14.6", features = [] }

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Remove debug symbols
