[package]
name = "oyasumivr-frame-helper"
version = "26.9.0-beta.14"
authors = ["Raphiiko"]
license = "MIT"
edition = "2021"

[dependencies]
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
