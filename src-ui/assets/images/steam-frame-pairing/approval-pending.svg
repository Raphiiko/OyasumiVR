<svg xmlns="http://www.w3.org/2000/svg" id="frame-request" width="180" height="120" viewBox="0 0 180 120" aria-hidden="true" focusable="false">
  <style>
    .frame-request-line { fill: none; stroke: #b4b4b4; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .frame-request-card { opacity: 0; animation: frame-request-arrive 1.5s ease-in-out 1 both; }
    .frame-request-pending { animation: frame-request-show 1.5s ease-out 1 both; }
    @keyframes frame-request-arrive {
      0% { transform: translate(50px, 43px); opacity: 0; }
      15% { opacity: 1; }
      60% { transform: translate(82px, 28px); opacity: 1; }
      90% { transform: translate(110px, 25px); opacity: 1; }
      100% { transform: translate(110px, 25px); opacity: 0; }
    }
    @keyframes frame-request-show { 0%, 80% { opacity: 0; } 100% { opacity: 1; } }
    #frame-request[data-reduced-motion="true"] .frame-request-card,
    #frame-request[data-reduced-motion="true"] .frame-request-pending { animation: none; }
    @media (prefers-reduced-motion: reduce) { .frame-request-card, .frame-request-pending { animation: none; } }
  </style>
  <g class="frame-request-line">
    <g data-pc="tower">
      <rect x="22" y="43" width="28" height="55" rx="3" fill="#252525"/>
