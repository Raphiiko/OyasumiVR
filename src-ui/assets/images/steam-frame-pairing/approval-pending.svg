      <circle cx="-27" cy="11" r="1.5" fill="#151515" stroke="#8f8f8f" stroke-width="1"/>
      <circle cx="27" cy="11" r="1.5" fill="#151515" stroke="#8f8f8f" stroke-width="1"/>
    </g>
    <path data-headset-wire="left" d="M-36-20C-42-39-34-41-22-30" fill="none" stroke="#8f8f8f" stroke-width="2"/>
