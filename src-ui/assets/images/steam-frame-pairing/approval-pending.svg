    <g transform="translate(127 78)" stroke-linecap="round" stroke-linejoin="round">
    <g data-headset-body="symmetric">
      <path d="M0 -32C-15 -32 -26 -31 -30 -27C-32 -24 -34 -19 -35 -15C-32 -15 -29 -15 -28 -15C-26 -23 -23 -27 0 -27C23 -27 26 -23 28 -15C29 -15 32 -15 35 -15C34 -19 32 -24 30 -27C26 -31 15 -32 0 -32Z" fill="#252525" stroke="#b4b4b4" stroke-width="1.4"/>
