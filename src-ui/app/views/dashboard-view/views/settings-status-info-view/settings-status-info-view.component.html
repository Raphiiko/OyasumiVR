<div class="pane fill">
  <div class="pane-title" transloco="settings.statusInfo.title"></div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      <p transloco="settings.statusInfo.description"></p>
      <div class="settings">
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="settings.statusInfo.copy.title"></span>
            <span transloco="settings.statusInfo.copy.description"></span>
          </div>
          <div class="setting-row-action">
            <button class="btn btn-primary btn-copy" (click)="copyToClipboard()">
              @if (!copiedToClipboard.includes('ALL_DATA')) {
                <span @hshrink>
                  <app-icon name="copy" />
                  <span transloco="settings.statusInfo.copy.action"></span>
                </span>
              }
              @if (copiedToClipboard.includes('ALL_DATA')) {
                <app-icon class="success" name="check" @hshrink />
              }
            </button>
          </div>
        </div>
        @for (category of categories; track category) {
          <div class="setting-row">
            <div class="setting-row-label">
              <span>{{ category.name | tsTranslate }}</span>
              <span></span>
            </div>
            <div class="setting-row-action"></div>
          </div>
          <div class="setting-row-group">
            @for (entry of category.entries; track entry) {
              <div class="setting-row" [class.compact]="compact">
                <div class="setting-row-label">
                  <span>{{ entry.key | tsTranslate }}</span>
                  <span></span>
                </div>
                <div class="setting-row-action">
                  <span (click)="copyValue(entry)"
                    ><b>{{ (entry.value | async) ?? '' | tsTranslate }}</b></span
                  >
                </div>
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
