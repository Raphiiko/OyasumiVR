<div class="pane modal-md" @fadeUp>
  <div class="pane-title" transloco="sleep-detection.modals.disableAfterTime.title"></div>
  <div class="pane-content">
    <p transloco="sleep-detection.modals.disableAfterTime.description"></p>
    <div class="settings">
      <app-setting-row
        label="sleep-detection.modals.disableAfterTime.time"
        [descriptionText]="getStringForDuration(duration)"
        [value]="duration"
        [defaultValue]="automationDefaults.SLEEP_MODE_DISABLE_AFTER_TIME.duration"
        (resetToDefault)="duration = $event"
      >
        <div class="input-wrapper">
          <input type="time" (change)="duration = timeInput.value" [value]="duration" #timeInput />
        </div>
      </app-setting-row>
    </div>
  </div>
  <div class="pane-actions spread">
    <button class="btn btn-secondary" (click)="close()" transloco="shared.modals.cancel"></button>
    <button class="btn btn-primary" (click)="save()" transloco="shared.modals.save"></button>
  </div>
</div>
