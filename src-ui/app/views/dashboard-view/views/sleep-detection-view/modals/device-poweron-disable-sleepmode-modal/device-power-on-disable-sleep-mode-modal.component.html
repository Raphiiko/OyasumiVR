<div class="pane modal-md" [@fadeUp]>
  <div class="pane-title" transloco="sleep-detection.modals.disableOnDevicePowerOn.title"></div>
  <div class="pane-content">
    <div class="automation-settings">
      <div class="automation-settings-row">
        <div
          class="automation-settings-row-label"
          transloco="sleep-detection.modals.disableOnDevicePowerOn.whenTurningOn"
        ></div>
        <div class="automation-settings-row-controls">
          <label class="check-toggle">
            <span
              class="check-toggle-label"
              transloco="sleep-detection.modals.disableOnDevicePowerOn.Controller"
            ></span>
            <input
              type="checkbox"
              [checked]="triggerClasses.includes('Controller')"
              (change)="toggleClass('Controller')"
            />
            <span class="check-toggle-checkmark"></span>
          </label>
          <label class="check-toggle">
            <span
              class="check-toggle-label"
              transloco="sleep-detection.modals.disableOnDevicePowerOn.GenericTracker"
            ></span>
            <input
              type="checkbox"
              [checked]="triggerClasses.includes('GenericTracker')"
              (change)="toggleClass('GenericTracker')"
            />
            <span class="check-toggle-checkmark"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="pane-actions spread">
    <button class="btn btn-secondary" (click)="close()" transloco="shared.modals.cancel"></button>
    <button class="btn btn-primary" (click)="save()" transloco="shared.modals.save"></button>
  </div>
</div>
