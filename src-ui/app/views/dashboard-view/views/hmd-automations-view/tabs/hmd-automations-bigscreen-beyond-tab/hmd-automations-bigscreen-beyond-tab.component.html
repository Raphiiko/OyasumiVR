<p transloco="hmd-automations.bigscreenBeyond.description"></p>
<div class="setting-category">
  <h2 transloco="hmd-automations.bigscreenBeyond.fanControl.title"></h2>
  <div class="settings">
    @for (automation of fanAutomationEnableKeys; track automation) {
      <app-setting-row
        [label]="'hmd-automations.bigscreenBeyond.fanControl.' + automation + '.title'"
        [description]="'hmd-automations.bigscreenBeyond.fanControl.' + automation + '.description'"
        [value]="[
          fanControlConfig[automation],
          fanControlConfig[asFanControlKey(automation + 'FanSpeed')],
        ]"
        [defaultValue]="[
          fanControlDefaults[automation],
          fanControlDefaults[asFanControlKey(automation + 'FanSpeed')],
        ]"
        (resetToDefault)="resetFanAutomation(automation)"
      >
        <app-slider-setting
          class="with-margin"
          [min]="fanControlConfig.allowUnsafeFanSpeed ? 0 : MIN_SAFE_FAN_SPEED"
          [max]="100"
          [value]="asNumber(fanControlConfig[asFanControlKey(automation + 'FanSpeed')])"
          (valueChange)="updateFanAutomationSpeed(automation, $event)"
          unit="%"
          [disabled]="!fanControlConfig[automation]"
        ></app-slider-setting>
        <label class="switch-toggle">
          <input
            type="checkbox"
            [checked]="fanControlConfig[automation]"
            (change)="toggleFanAutomation(automation)"
          />
          <span class="switch-toggle-slider"></span>
        </label>
      </app-setting-row>
    }
  </div>
  <div class="settings">
    <app-setting-row
      label="hmd-automations.bigscreenBeyond.fanControl.allowUnsafeFanSpeed.title"
      description="hmd-automations.bigscreenBeyond.fanControl.allowUnsafeFanSpeed.description"
      [value]="fanControlConfig.allowUnsafeFanSpeed"
      [defaultValue]="fanControlDefaults.allowUnsafeFanSpeed"
      (resetToDefault)="toggleUnsafeFanSpeed()"
    >
      <span
        rowLabel
        class="experimental-flag"
        [tooltip]="'hmd-automations.bigscreenBeyond.fanControl.allowUnsafeFanSpeed.warning'"
        [tooltipMode]="'right'"
      >
        <app-icon name="warning" />
      </span>
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="!fanControlConfig.allowUnsafeFanSpeed"
          (change)="toggleUnsafeFanSpeed()"
        />
        <span class="switch-toggle-slider"></span>
      </label>
    </app-setting-row>
    <app-setting-row
      label="settings.brightnessCct.bigscreenBeyond.forceFanSafety.title"
      description="settings.brightnessCct.bigscreenBeyond.forceFanSafety.description"
      [value]="appSettings.bigscreenBeyondBrightnessFanSafety"
      [defaultValue]="appSettingsDefaults.bigscreenBeyondBrightnessFanSafety"
      (resetToDefault)="toggleBigscreenBeyondForceFanBrightnessSafety()"
    >
      <span
        rowLabel
        class="experimental-flag"
        [tooltip]="'settings.brightnessCct.bigscreenBeyond.forceFanSafety.warning'"
        [tooltipMode]="'right'"
      >
        <app-icon name="warning" />
      </span>
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="appSettings.bigscreenBeyondBrightnessFanSafety"
          (change)="toggleBigscreenBeyondForceFanBrightnessSafety()"
        />
        <span class="switch-toggle-slider"></span>
      </label>
    </app-setting-row>
  </div>
</div>
<div class="setting-category">
  <h2 transloco="hmd-automations.bigscreenBeyond.rgb.title"></h2>
  <div class="settings">
    @for (automation of rgbAutomationEnableKeys; track automation) {
      <app-setting-row
        [label]="'hmd-automations.bigscreenBeyond.rgb.' + automation + '.title'"
        [description]="'hmd-automations.bigscreenBeyond.rgb.' + automation + '.description'"
        [value]="[
          rgbControlConfig[automation],
          rgbControlConfig[asRgbControlKey(automation + 'Rgb')],
        ]"
        [defaultValue]="[
          rgbControlDefaults[automation],
          rgbControlDefaults[asRgbControlKey(automation + 'Rgb')],
        ]"
        (resetToDefault)="resetRgbAutomation(automation)"
      >
        <app-color-picker
          class="with-margin"
          [disabled]="!rgbControlConfig[automation]"
          [color]="asColor(rgbControlConfig[asRgbControlKey(automation + 'Rgb')])"
          (colorChange)="updateRgbAutomation(automation, $event)"
        ></app-color-picker>
        <label class="switch-toggle">
          <input
            type="checkbox"
            [checked]="rgbControlConfig[automation]"
            (change)="toggleRgbAutomation(automation)"
          />
          <span class="switch-toggle-slider"></span>
        </label>
      </app-setting-row>
    }
  </div>
</div>
