<div class="pane main">
  <div class="pane-title" transloco="join-notifications.title"></div>
  <div class="pane-content">
    <div class="setting-view-container">
      <p transloco="join-notifications.description"></p>
      @if ((vrchat.user | async) === null) {
        <div class="alert warning" @vshrink>
          <div class="alert-bg"></div>
          <div class="alert-icon">
            <i class="material-icons"> warning </i>
          </div>
          <div class="alert-content">
            <span>{{ 'shared.common.vrcLoginRequired' | transloco }}</span>
            <button
              class="btn btn-secondary"
              (click)="vrchat.showLoginModal()"
              transloco="shared.modals.login"
            ></button>
          </div>
        </div>
      }
      <div class="settings">
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.joinNotifications.title"></span>
            <span transloco="join-notifications.joinNotifications.description"></span>
          </div>
          <div class="setting-row-action">
            <app-select-box
              class="preset-select-box"
              [type]="'SMALL'"
              [items]="notificationOptions"
              [selected]="joinNotificationOption"
              (selectedChange)="
                setJoinNotificationModeOption(
                  asJoinNotificationsMode($safeNavigationMigration($event?.id))
                )
              "
            ></app-select-box>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.joinSounds.title"></span>
            <span transloco="join-notifications.joinSounds.description"></span>
          </div>
          <div class="setting-row-action">
            <app-select-box
              class="preset-select-box"
              [type]="'SMALL'"
              [items]="notificationOptions"
              [selected]="joinSoundOption"
              (selectedChange)="
                setJoinSoundModeOption(
                  asJoinNotificationsMode($safeNavigationMigration($event?.id))
                )
              "
            ></app-select-box>
          </div>
        </div>
        @if (joinSoundOption?.id !== 'DISABLED') {
          <div class="setting-row-group" @vshrink>
            <div class="setting-row">
              <div class="setting-row-label">
                <span transloco="join-notifications.joinSound.title"></span>
                <span transloco="join-notifications.joinSound.description"></span>
              </div>
              <div class="setting-row-action">
                <app-notification-sound-button
                  [toggleable]="false"
                  [soundConfig]="config.joinSound"
                  (soundConfigChange)="updateJoinSound($event)"
                ></app-notification-sound-button>
              </div>
            </div>
          </div>
        }
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.onlyWhenPreviouslyAlone.title"></span>
            <span transloco="join-notifications.onlyWhenPreviouslyAlone.description"></span>
          </div>
          <div class="setting-row-action">
            <label class="switch-toggle">
              <input
                type="checkbox"
                [checked]="config.onlyWhenPreviouslyAlone"
                (change)="toggleOnlyWhenPreviouslyAlone()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
      <div class="settings">
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.leaveNotifications.title"></span>
            <span transloco="join-notifications.leaveNotifications.description"></span>
          </div>
          <div class="setting-row-action">
            <app-select-box
              class="preset-select-box"
              [type]="'SMALL'"
              [items]="notificationOptions"
              [selected]="leaveNotificationOption"
              (selectedChange)="
                setLeaveNotificationModeOption(
                  asJoinNotificationsMode($safeNavigationMigration($event?.id))
                )
              "
            ></app-select-box>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.leaveSounds.title"></span>
            <span transloco="join-notifications.leaveSounds.description"></span>
          </div>
          <div class="setting-row-action">
            <app-select-box
              class="preset-select-box"
              [type]="'SMALL'"
              [items]="notificationOptions"
              [selected]="leaveSoundOption"
              (selectedChange)="
                setLeaveSoundModeOption(
                  asJoinNotificationsMode($safeNavigationMigration($event?.id))
                )
              "
            ></app-select-box>
          </div>
        </div>
        @if (leaveSoundOption?.id !== 'DISABLED') {
          <div class="setting-row-group" @vshrink>
            <div class="setting-row">
              <div class="setting-row-label">
                <span transloco="join-notifications.leaveSound.title"></span>
                <span transloco="join-notifications.leaveSound.description"></span>
              </div>
              <div class="setting-row-action">
                <app-notification-sound-button
                  [toggleable]="false"
                  [soundConfig]="config.leaveSound"
                  (soundConfigChange)="updateLeaveSound($event)"
                ></app-notification-sound-button>
              </div>
            </div>
          </div>
        }
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.onlyWhenLeftAlone.title"></span>
            <span transloco="join-notifications.onlyWhenLeftAlone.description"></span>
          </div>
          <div class="setting-row-action">
            <label class="switch-toggle">
              <input
                type="checkbox"
                [checked]="config.onlyWhenLeftAlone"
                (change)="toggleOnlyWhenLeftAlone()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
      <div class="settings">
        <div class="setting-row">
          <div class="setting-row-label">
            <span transloco="join-notifications.onlyWhenSleepModeActive.title"></span>
            <span></span>
          </div>
          <div class="setting-row-action">
            <label class="switch-toggle">
              <input
                type="checkbox"
                [checked]="config.onlyDuringSleepMode"
                (change)="toggleOnlyDuringSleepMode()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<app-player-list
  [playerIds]="config.playerIds"
  (playerIdsChange)="updatePlayerIds($event)"
></app-player-list>
