<div class="pane fill">
  <div class="pane-title" transloco="vrchatAvatarAutomations.title"></div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      <div class="setting-category">
        <p transloco="vrchatAvatarAutomations.description"></p>
        @if (!loggedIn) {
          <div class="alert warning" @vshrink>
            <div class="alert-bg"></div>
            <div class="alert-icon">
              <i class="material-icons"> warning </i>
            </div>
            <div class="alert-content">
              <span>{{ 'shared.common.vrcLoginRequired' | transloco }}</span>
              <button
                class="btn btn-secondary"
                (click)="login()"
                transloco="shared.modals.login"
              ></button>
            </div>
          </div>
        }
        <div class="settings">
          <app-setting-row
            label="vrchatAvatarAutomations.onSleepEnable.title"
            description="vrchatAvatarAutomations.onSleepEnable.description"
          >
            <app-vrc-avatar-select-button
              [avatar]="this.config.onSleepEnable"
              (avatarChange)="updateOnSleepEnable($event)"
            ></app-vrc-avatar-select-button>
          </app-setting-row>
          <app-setting-row
            label="vrchatAvatarAutomations.onSleepDisable.title"
            description="vrchatAvatarAutomations.onSleepDisable.description"
          >
            <app-vrc-avatar-select-button
              [avatar]="this.config.onSleepDisable"
              (avatarChange)="updateOnSleepDisable($event)"
            ></app-vrc-avatar-select-button>
          </app-setting-row>
          <app-setting-row
            label="vrchatAvatarAutomations.onSleepPreparation.title"
            description="vrchatAvatarAutomations.onSleepPreparation.description"
          >
            <app-vrc-avatar-select-button
              [avatar]="this.config.onSleepPreparation"
              (avatarChange)="updateOnSleepPreparation($event)"
            ></app-vrc-avatar-select-button>
          </app-setting-row>
        </div>
      </div>
    </div>
  </div>
</div>
