<div class="setting-category">
  <p transloco="status-automations.general.description"></p>
  @if (!loggedIn) {
    <app-alert severity="warning" @vshrink contentClass="with-action">
      <span>{{ 'shared.common.vrcLoginRequired' | transloco }}</span>
      <button class="btn btn-secondary" (click)="login()" transloco="shared.modals.login"></button>
    </app-alert>
  }
  <div class="settings">
    <app-setting-row
      label="status-automations.general.onSleepEnable.title"
      description="status-automations.general.onSleepEnable.description.status"
      [value]="{
        changeStatusOnSleepModeEnable: config.changeStatusOnSleepModeEnable,
        statusOnSleepModeEnable: config.statusOnSleepModeEnable,
      }"
      [defaultValue]="{
        changeStatusOnSleepModeEnable: defaults.changeStatusOnSleepModeEnable,
        statusOnSleepModeEnable: defaults.statusOnSleepModeEnable,
      }"
      (resetToDefault)="updateConfig($event)"
    >
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="config.changeStatusOnSleepModeEnable"
          (change)="
            updateConfig({ changeStatusOnSleepModeEnable: !config.changeStatusOnSleepModeEnable })
          "
        />
        <span class="switch-toggle-slider"></span>
      </label>
      <app-select-box
        class="status-dropdown"
        [type]="'SMALL'"
        [items]="statusOptions"
        [selected]="onSleepEnableStatusOption"
        (selectedChange)="setStatusOption('ON_SLEEP_ENABLE', $event)"
        [disabled]="!config.changeStatusOnSleepModeEnable"
      ></app-select-box>
    </app-setting-row>
    <app-setting-row
      description="status-automations.general.onSleepEnable.description.statusMessage"
      [value]="{
        changeStatusMessageOnSleepModeEnable: config.changeStatusMessageOnSleepModeEnable,
        statusMessageOnSleepModeEnable: config.statusMessageOnSleepModeEnable,
      }"
      [defaultValue]="{
        changeStatusMessageOnSleepModeEnable: defaults.changeStatusMessageOnSleepModeEnable,
        statusMessageOnSleepModeEnable: defaults.statusMessageOnSleepModeEnable,
      }"
      (resetToDefault)="updateConfig($event)"
    >
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="config.changeStatusMessageOnSleepModeEnable"
          (change)="
            updateConfig({
              changeStatusMessageOnSleepModeEnable: !config.changeStatusMessageOnSleepModeEnable,
            })
          "
        />
        <span class="switch-toggle-slider"></span>
      </label>
      <input
        type="text"
        [disabled]="!config.changeStatusMessageOnSleepModeEnable"
        maxlength="32"
        [value]="config.statusMessageOnSleepModeEnable"
        (input)="updateStatusMessage('ON_SLEEP_ENABLE', onSleepEnableStatusMessageInput.value)"
        #onSleepEnableStatusMessageInput
      />
    </app-setting-row>
    <app-setting-row
      label="status-automations.general.onSleepDisable.title"
      description="status-automations.general.onSleepDisable.description.status"

        changeStatusOnSleepModeDisable: config.changeStatusOnSleepModeDisable,

            updateConfig({
              changeStatusOnSleepModeDisable: !config.changeStatusOnSleepModeDisable,

        <span class="switch-toggle-slider"></span>
      </label>
      <app-select-box

    >
      <label class="switch-toggle">

    >

      />
    </app-setting-row>
  </div>
</div>
<app-alert severity="warning" style="margin-top: 1em" contentClass="with-action">
  <span>{{ 'status-automations.behaviourWarning' | transloco }}</span>
  <button
    class="btn btn-secondary"
    (click)="showFAQ()"
    transloco="status-automations.moreInfo"
    style="margin-left: 1em"
  ></button>
</app-alert>
