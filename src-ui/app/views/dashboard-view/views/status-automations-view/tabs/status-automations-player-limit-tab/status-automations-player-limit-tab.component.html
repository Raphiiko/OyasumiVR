<p transloco="status-automations.playerLimit.description"></p>
@if (!loggedIn) {
  <app-alert severity="warning" @vshrink contentClass="with-action">
    <span>{{ 'shared.common.vrcLoginRequired' | transloco }}</span>
    <button class="btn btn-secondary" (click)="login()" transloco="shared.modals.login"></button>
  </app-alert>
}
<div class="settings">
  <app-setting-row
    label="status-automations.playerLimit.enable.title"
    description="status-automations.playerLimit.enable.description"
    [value]="config.enabled"
    [defaultValue]="defaults.enabled"
    (resetToDefault)="updateConfig({ enabled: $event })"
  >
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="config.enabled"
        (change)="updateConfig({ enabled: !config.enabled })"
      />
      <span class="switch-toggle-slider"></span>
    </label>
  </app-setting-row>
</div>
<div class="settings" [class.disabled]="config.enabled">
  @if (config.enabled) {
    <app-alert severity="info" @vshrink contentClass="with-action"
      >{{ 'status-automations.playerLimit.disableToEdit' | transloco }}
    </app-alert>
  }
  <div class="limit-setting">
    <h3 class="heading-with-reset">
      <span transloco="status-automations.playerLimit.playerLimit"></span>
      <app-reset-to-default
        [value]="limit.value"
        [defaultValue]="defaults.limit"
        (resetToDefault)="onLimitChange($event)"
      />
    </h3>
    <app-player-count-sleep-visualization
      [count]="limit.value"
    ></app-player-count-sleep-visualization>

    <div class="limit-setting-controls">
      <div class="limit-setting-controls-slider">
        <app-slider
          [min]="1"
          [max]="40"
          [step]="1"
          [value]="limit.value"
          (valueChange)="onLimitChange($event)"
        ></app-slider>
      </div>
      <div class="limit-setting-controls-numeric-input">
        <input
          type="number"
          min="1"
          max="40"
          step="1"
          [value]="limit.value"
          (input)="onLimitChange(limitNumberInput.value)"
          (blur)="limitNumberInput.value = limit.value.toString()"
          #limitNumberInput
        />
      </div>
    </div>
    <div
      class="limit-setting-description"
      [transloco]="'status-automations.playerLimit.playerLimitLabel'"
      [translocoParams]="{ count: limit.value }"
    ></div>
  </div>
  <app-setting-row
    label="status-automations.playerLimit.belowLimit.title"
    description="status-automations.playerLimit.belowLimit.description.status"
    [value]="{
      statusBelowLimitEnabled: config.statusBelowLimitEnabled,
      statusBelowLimit: config.statusBelowLimit,
    }"
    [defaultValue]="{
      statusBelowLimitEnabled: defaults.statusBelowLimitEnabled,
      statusBelowLimit: defaults.statusBelowLimit,
    }"
    (resetToDefault)="updateConfig($event)"
  >
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="config.statusBelowLimitEnabled"
        (change)="updateConfig({ statusBelowLimitEnabled: !config.statusBelowLimitEnabled })"
      />
      <span class="switch-toggle-slider"></span>
    </label>
    <app-select-box
      class="status-dropdown"
      [type]="'SMALL'"
      [items]="statusOptions"
      [selected]="optionSetStatusBelowLimit"
      (selectedChange)="setStatusSetOption('belowLimit', $event)"
      [disabled]="!config.statusBelowLimitEnabled"
    ></app-select-box>
  </app-setting-row>
  <app-setting-row
    description="status-automations.playerLimit.belowLimit.description.statusMessage"
    [value]="{
      statusMessageBelowLimitEnabled: config.statusMessageBelowLimitEnabled,
      statusMessageBelowLimit: config.statusMessageBelowLimit,
    }"
    [defaultValue]="{
      statusMessageBelowLimitEnabled: defaults.statusMessageBelowLimitEnabled,
      statusMessageBelowLimit: defaults.statusMessageBelowLimit,
    }"
    (resetToDefault)="updateConfig($event)"
  >
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="config.statusMessageBelowLimitEnabled"
        (change)="
          updateConfig({ statusMessageBelowLimitEnabled: !config.statusMessageBelowLimitEnabled })
        "
      />
      <span class="switch-toggle-slider"></span>
    </label>
    <input
      type="text"
      [disabled]="!config.statusMessageBelowLimitEnabled"
      maxlength="32"
      [value]="config.statusMessageBelowLimit"
      (input)="onChangeStatusMessage('statusMessageBelowLimit', belowLimitStatusMessageInput.value)"
      #belowLimitStatusMessageInput
    />
  </app-setting-row>
  <app-setting-row
    label="status-automations.playerLimit.atLimitOrAbove.title"
    description="status-automations.playerLimit.atLimitOrAbove.description.status"
    [value]="{
      statusAtLimitOrAboveEnabled: config.statusAtLimitOrAboveEnabled,
      statusAtLimitOrAbove: config.statusAtLimitOrAbove,
    }"
    [defaultValue]="{
      statusAtLimitOrAboveEnabled: defaults.statusAtLimitOrAboveEnabled,
      statusAtLimitOrAbove: defaults.statusAtLimitOrAbove,
    }"
    (resetToDefault)="updateConfig($event)"
  >
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="config.statusAtLimitOrAboveEnabled"
        (change)="
          updateConfig({ statusAtLimitOrAboveEnabled: !config.statusAtLimitOrAboveEnabled })
        "
      />
      <span class="switch-toggle-slider"></span>
    </label>
    <app-select-box
      class="status-dropdown"
      [type]="'SMALL'"
      [items]="statusOptions"
      [selected]="optionSetStatusAtLimitOrAbove"
      (selectedChange)="setStatusSetOption('atLimitOrAbove', $event)"
      [disabled]="!config.statusAtLimitOrAboveEnabled"
    ></app-select-box>
  </app-setting-row>
  <app-setting-row
    description="status-automations.playerLimit.atLimitOrAbove.description.statusMessage"
    [value]="{
      statusMessageAtLimitOrAboveEnabled: config.statusMessageAtLimitOrAboveEnabled,
      statusMessageAtLimitOrAbove: config.statusMessageAtLimitOrAbove,
    }"
    [defaultValue]="{
      statusMessageAtLimitOrAboveEnabled: defaults.statusMessageAtLimitOrAboveEnabled,
      statusMessageAtLimitOrAbove: defaults.statusMessageAtLimitOrAbove,
    }"
    (resetToDefault)="updateConfig($event)"
  >
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="config.statusMessageAtLimitOrAboveEnabled"
        (change)="
          updateConfig({
            statusMessageAtLimitOrAboveEnabled: !config.statusMessageAtLimitOrAboveEnabled,
          })
        "
      />
      <span class="switch-toggle-slider"></span>
    </label>
    <input
      type="text"
      [disabled]="!config.statusMessageAtLimitOrAboveEnabled"
      maxlength="32"
      [value]="config.statusMessageAtLimitOrAbove"
      (input)="
        onChangeStatusMessage('statusMessageAtLimitOrAbove', atLimitOrAboveStatusMessageInput.value)
      "
      #atLimitOrAboveStatusMessageInput
    />
  </app-setting-row>
  <app-setting-row
    label="status-automations.playerLimit.onlyIfSleepModeEnabled"
    [value]="config.onlyIfSleepModeEnabled"
    [defaultValue]="defaults.onlyIfSleepModeEnabled"
    (resetToDefault)="updateConfig({ onlyIfSleepModeEnabled: $event })"
  >
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="config.onlyIfSleepModeEnabled"
        (change)="updateConfig({ onlyIfSleepModeEnabled: !config.onlyIfSleepModeEnabled })"
      />
      <span class="switch-toggle-slider"></span>
    </label>
  </app-setting-row>
</div>
<app-alert severity="warning" contentClass="with-action">
  <span>{{ 'status-automations.behaviourWarning' | transloco }}</span>
  <button
    class="btn btn-secondary"
    (click)="showFAQ()"
    transloco="status-automations.moreInfo"
    style="margin-left: 1em"
  ></button>
</app-alert>
