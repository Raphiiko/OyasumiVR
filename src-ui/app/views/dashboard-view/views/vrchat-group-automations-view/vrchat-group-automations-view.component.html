<div class="pane fill">
  <div class="pane-title" transloco="vrchatGroupAutomations.title"></div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      <div class="setting-category">
        <p transloco="vrchatGroupAutomations.description"></p>
        @if (!loggedIn) {
          <app-alert severity="warning" @vshrink contentClass="with-action">
            <span>{{ 'shared.common.vrcLoginRequired' | transloco }}</span>
            <button
              class="btn btn-secondary"
              (click)="login()"
              transloco="shared.modals.login"
            ></button>
          </app-alert>
        }
        <div class="settings">
          <app-setting-row
            label="vrchatGroupAutomations.onSleepEnable.title"
            description="vrchatGroupAutomations.onSleepEnable.description"
          >
            <app-select-box
              [disabled]="!loggedIn"
              [items]="groupOptions"
              [selected]="selectedOnSleepEnable"
              [type]="'SMALL'"
              (selectedChange)="updateGroupOnSleepEnable($event!.id)"
            ></app-select-box>
          </app-setting-row>
          <app-setting-row
            label="vrchatGroupAutomations.onSleepDisable.title"
            description="vrchatGroupAutomations.onSleepDisable.description"
          >
            <app-select-box
              [disabled]="!loggedIn"
              [items]="groupOptions"
              [selected]="selectedOnSleepDisable"
              [type]="'SMALL'"
              (selectedChange)="updateGroupOnSleepDisable($event!.id)"
            ></app-select-box>
          </app-setting-row>
          <app-setting-row
            label="vrchatGroupAutomations.onSleepPreparation.title"
            description="vrchatGroupAutomations.onSleepPreparation.description"
          >
            <app-select-box
              [disabled]="!loggedIn"
              [items]="groupOptions"
              [selected]="selectedOnSleepPreparation"
              [type]="'SMALL'"
              (selectedChange)="updateGroupOnSleepPreparation($event!.id)"
            ></app-select-box>
          </app-setting-row>
        </div>
      </div>
    </div>
  </div>
</div>
