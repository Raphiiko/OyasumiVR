<div class="pane">
  <div class="pane-title" transloco="vrchatGroupAutomations.title"></div>
  <div class="pane-content">
    <div class="setting-view-container">
      <div class="setting-category">
        <p transloco="vrchatGroupAutomations.description"></p>
        @if (!loggedIn) {
          <div class="alert warning" @vshrink>
            <div class="alert-bg"></div>
            <div class="alert-icon">
              <i class="material-icons"> warning </i>
            </div>
            <div class="alert-content">
              <span>{{ 'shared.common.vrcLoginRequired' | transloco }}</span>
              <button
                class="btn btn-secondary"
                (click)="login()"
                transloco="shared.modals.login"
              ></button>
            </div>
          </div>
        }
        <div class="settings">
          <div class="setting-row">
            <div class="setting-row-label">
              <span transloco="vrchatGroupAutomations.onSleepEnable.title"></span>
              <span transloco="vrchatGroupAutomations.onSleepEnable.description"></span>
            </div>
            <div class="setting-row-action">
              <app-select-box
                [disabled]="!loggedIn"
                [items]="groupOptions"
                [selected]="selectedOnSleepEnable"
                [type]="'SMALL'"
                (selectedChange)="updateGroupOnSleepEnable($event!.id)"
              ></app-select-box>
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-row-label">
              <span transloco="vrchatGroupAutomations.onSleepDisable.title"></span>
              <span transloco="vrchatGroupAutomations.onSleepDisable.description"></span>
            </div>
            <div class="setting-row-action">
              <app-select-box
                [disabled]="!loggedIn"
                [items]="groupOptions"
                [selected]="selectedOnSleepDisable"
                [type]="'SMALL'"
                (selectedChange)="updateGroupOnSleepDisable($event!.id)"
              ></app-select-box>
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-row-label">
              <span transloco="vrchatGroupAutomations.onSleepPreparation.title"></span>
              <span transloco="vrchatGroupAutomations.onSleepPreparation.description"></span>
            </div>
            <div class="setting-row-action">
              <app-select-box
                [disabled]="!loggedIn"
                [items]="groupOptions"
                [selected]="selectedOnSleepPreparation"
                [type]="'SMALL'"
                (selectedChange)="updateGroupOnSleepPreparation($event!.id)"
              ></app-select-box>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
