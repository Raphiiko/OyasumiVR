<div class="setting-category">
  <div class="description">
    <p>
      <span transloco="power-automations.windowsPowerPolicy.description"></span>
    </p>
    <app-icon name="leaf" class="description-icon" />
  </div>
  <h3 transloco="power-automations.windowsPowerPolicy.automations"></h3>
  <div class="settings">
    <app-setting-row
      label="power-automations.windowsPowerPolicy.sleepModeEnable.title"
      description="power-automations.windowsPowerPolicy.sleepModeEnable.description"
      [value]="automationConfigs.WINDOWS_POWER_POLICY_ON_SLEEP_MODE_ENABLE.enabled"
      [defaultValue]="automationDefaults.WINDOWS_POWER_POLICY_ON_SLEEP_MODE_ENABLE.enabled"
      (resetToDefault)="setPolicy('ON_ENABLE', policyOptions[0])"
    >
      <app-select-box
        type="SMALL"
        [items]="policyOptions"
        [selected]="onSleepModeEnablePolicy"
        (selectedChange)="setPolicy('ON_ENABLE', $event!)"
      ></app-select-box>
    </app-setting-row>
    <app-setting-row
      label="power-automations.windowsPowerPolicy.sleepModeDisable.title"
      description="power-automations.windowsPowerPolicy.sleepModeDisable.description"
      [value]="automationConfigs.WINDOWS_POWER_POLICY_ON_SLEEP_MODE_DISABLE.enabled"
      [defaultValue]="automationDefaults.WINDOWS_POWER_POLICY_ON_SLEEP_MODE_DISABLE.enabled"
      (resetToDefault)="setPolicy('ON_DISABLE', policyOptions[0])"
    >
      <app-select-box
        type="SMALL"
        [items]="policyOptions"
        [selected]="onSleepModeDisablePolicy"
        (selectedChange)="setPolicy('ON_DISABLE', $event!)"
      ></app-select-box>
    </app-setting-row>
  </div>
</div>
