<div class="pane fill">
  <div class="pane-title" transloco="settings.hotkeys.title"></div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      <p transloco="settings.hotkeys.description"></p>
      <h2 transloco="settings.hotkeys.actions"></h2>
      <div class="settings">
        @for (action of actions; track action) {
          <app-setting-row
            [label]="'settings.hotkeys.action.' + action.id"
            description="settings.hotkeys.actionDescription"
          >
            <app-hotkey-selector [action]="action.id"></app-hotkey-selector>
          </app-setting-row>
        }
      </div>
    </div>
  </div>
</div>
