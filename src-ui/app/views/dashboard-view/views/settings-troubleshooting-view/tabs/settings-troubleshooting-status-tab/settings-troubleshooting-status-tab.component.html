<div class="setting-category">
  <h2 transloco="settings.troubleshooting.support.title"></h2>
  <div class="settings">
    <app-setting-row
      label="settings.troubleshooting.support.debugReport.title"
      description="settings.troubleshooting.support.debugReport.description"
    >
      <button class="btn btn-primary" (click)="openDebugReport()">
        <span transloco="settings.troubleshooting.support.debugReport.action"></span>
      </button>
    </app-setting-row>
    @if (debugReports.recentCode | async; as code) {
      <div class="setting-row">
        <div class="setting-row-label">
          <span class="recent-code">{{ code }}</span>
          <span transloco="settings.troubleshooting.support.recentCode"></span>
        </div>
        <div class="setting-row-action">
          <button class="btn btn-secondary" (click)="copyRecentCode(code)">
            <app-icon name="copy" />
            <span transloco="settings.troubleshooting.debugReport.done.copy"></span>
          </button>
        </div>
      </div>
    }
    <div class="setting-row">
      <div class="setting-row-label">
        <span>v{{ version | async }}</span>
        <span>{{ build | tsTranslate }}</span>
      </div>
      <div class="setting-row-action">
        <button class="btn btn-secondary" (click)="copyVersion()">
          <app-icon name="copy" />
          <span transloco="settings.troubleshooting.support.version.copy"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="setting-category">
  <h2 transloco="settings.troubleshooting.status.title"></h2>
  <div class="status-grid">
    @for (line of status; track line.label) {
      <div class="status-tile" [class.wide]="line.wide">
        <div class="status-tile-label" [transloco]="line.label"></div>
        <div class="status-tile-value">{{ (line.value | async) ?? '' | tsTranslate }}</div>
        @if (line.detail | async; as detail) {
          <div class="status-tile-detail">{{ detail | tsTranslate }}</div>
        }
      </div>
    }
  </div>
</div>
