<p transloco="settings.troubleshooting.tweaks.description"></p>
<div class="setting-category">
  <div class="settings">
    <app-setting-row
      label="settings.troubleshooting.tweaks.overlayGpuAcceleration.title"
      description="settings.troubleshooting.tweaks.overlayGpuAcceleration.description"
      [value]="settings.overlayGpuAcceleration"
      [defaultValue]="defaults.overlayGpuAcceleration"
      (resetToDefault)="update({ overlayGpuAcceleration: $event })"
    >
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="settings.overlayGpuAcceleration"
          (change)="update({ overlayGpuAcceleration: !settings.overlayGpuAcceleration })"
        />
        <span class="switch-toggle-slider"></span>
      </label>
    </app-setting-row>
    <app-setting-row
      label="settings.troubleshooting.tweaks.openVrInitDelayFix.title"
      description="settings.troubleshooting.tweaks.openVrInitDelayFix.description"
      [value]="settings.openVrInitDelayFix"
      [defaultValue]="defaults.openVrInitDelayFix"
      (resetToDefault)="update({ openVrInitDelayFix: $event })"
    >
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="settings.openVrInitDelayFix"
          (change)="update({ openVrInitDelayFix: !settings.openVrInitDelayFix })"
        />
        <span class="switch-toggle-slider"></span>
      </label>
    </app-setting-row>
    <app-setting-row
      label="settings.general.lighthouseConsole.powerOffDelay.title"
      description="settings.general.lighthouseConsole.powerOffDelay.description"
      [value]="settings.lighthousePowerOffDelay"
      [defaultValue]="defaults.lighthousePowerOffDelay"
      (resetToDefault)="update({ lighthousePowerOffDelay: $event })"
    >
      <label class="switch-toggle">
        <input
          type="checkbox"
          [checked]="settings.lighthousePowerOffDelay"
          (change)="update({ lighthousePowerOffDelay: !settings.lighthousePowerOffDelay })"
        />
        <span class="switch-toggle-slider"></span>
      </label>
    </app-setting-row>
  </div>
</div>
