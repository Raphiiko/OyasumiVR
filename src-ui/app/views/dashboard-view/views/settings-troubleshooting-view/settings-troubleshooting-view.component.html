<div class="pane fill">
  <div class="pane-title" transloco="settings.troubleshooting.title"></div>
  <div class="tab-bar">
    <div class="tab" [class.active]="activeTab === 'STATUS'" (click)="activeTab = 'STATUS'">
      <div class="tab-label" transloco="settings.troubleshooting.tabs.status"></div>
    </div>
    <div class="tab" [class.active]="activeTab === 'TOOLS'" (click)="activeTab = 'TOOLS'">
      <div class="tab-label" transloco="settings.troubleshooting.tabs.tools"></div>
    </div>
    <div class="tab" [class.active]="activeTab === 'TWEAKS'" (click)="activeTab = 'TWEAKS'">
      <div class="tab-label" transloco="settings.troubleshooting.tabs.tweaks"></div>
    </div>
  </div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      @if (activeTab === 'STATUS') {
        <app-settings-troubleshooting-status-tab></app-settings-troubleshooting-status-tab>
      }
      @if (activeTab === 'TOOLS') {
        <app-settings-troubleshooting-tools-tab></app-settings-troubleshooting-tools-tab>
      }
      @if (activeTab === 'TWEAKS') {
        <app-settings-troubleshooting-tweaks-tab></app-settings-troubleshooting-tweaks-tab>
      }
    </div>
  </div>
</div>
