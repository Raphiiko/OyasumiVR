<div class="pane fill">
  <div class="pane-title">
    <span transloco="settings.brightnessCct.title"></span>
    <app-brightness-advanced-mode-toggle></app-brightness-advanced-mode-toggle>
  </div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      <p transloco="settings.brightnessCct.description"></p>
      <div class="setting-category">
        <h2 transloco="settings.brightnessCct.cctControl.title"></h2>
        <div class="settings">
          <app-setting-row
            label="settings.brightnessCct.cctControl.unsupportedHmds.title"
            description="settings.brightnessCct.cctControl.unsupportedHmds.description"
          >
            <label class="switch-toggle" [class.disabled]="listedHmd">
              <input
                type="checkbox"
                [checked]="listedHmd || appSettings.cctControlOnUnsupportedHmds"
                [disabled]="listedHmd"
                (change)="toggleCCTControlOnUnsupportedHmds()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </app-setting-row>
          @if (appSettings.cctControlOnUnsupportedHmds && unlistedHmd) {
            <app-alert severity="info" @vshrink>
              <span>
                {{
                  'settings.brightnessCct.cctControl.unsupportedHmds.unlistedHmd'
                    | transloco: unlistedHmd
                }}
                <a href="https://discord.gg/7MqdPJhYxC" target="_blank">{{
                  'settings.brightnessCct.cctControl.unsupportedHmds.report' | transloco
                }}</a>
              </span>
            </app-alert>
          }
        </div>
      </div>

      <div class="setting-category">
        <h2 transloco="settings.brightnessCct.valveIndex.title"></h2>
        <div class="settings">
          <app-setting-row
            label="settings.brightnessCct.valveIndex.maxBrightness.title"
            description="settings.brightnessCct.valveIndex.maxBrightness.description"
          >
            <app-slider-setting
              [min]="valveIndexMin"
              [max]="valveIndexMax"
              [value]="appSettings.valveIndexMaxBrightness"
              (valueChange)="changeValveIndexMaxBrightness($event)"
              unit="%"
            ></app-slider-setting>
          </app-setting-row>
        </div>
      </div>

      <div class="setting-category">
        <h2 transloco="settings.brightnessCct.bigscreenBeyond.title"></h2>
        <div class="settings">
          <app-setting-row
            label="settings.brightnessCct.bigscreenBeyond.maxBrightness.title"
            description="settings.brightnessCct.bigscreenBeyond.maxBrightness.description"
          >
            <app-slider-setting
              [min]="bigscreenBeyondMin"
              [max]="bigscreenBeyondMax"
              [value]="appSettings.bigscreenBeyondMaxBrightness"
              (valueChange)="changeBigscreenBeyondMaxBrightness($event)"
              unit="%"
            ></app-slider-setting>
          </app-setting-row>
          <div class="setting-row">
            <div class="setting-row-label">
              <span class="row-title">
                <span
                  transloco="settings.brightnessCct.bigscreenBeyond.permitRiskRange.title"
                ></span>
                <span
                  class="experimental-flag"
                  [tooltip]="'settings.brightnessCct.bigscreenBeyond.permitRiskRange.warning'"
                  [tooltipMode]="'right'"
                >
                  <app-icon name="warning" />
                </span>
              </span>
              <span
                transloco="settings.brightnessCct.bigscreenBeyond.permitRiskRange.description"
              ></span>
            </div>
            <div class="setting-row-action">
              <label class="switch-toggle">
                <input
                  type="checkbox"
                  [checked]="!appSettings.bigscreenBeyondUnsafeBrightness"
                  (change)="toggleBigscreenBeyondUnsafeBrightness()"
                />
                <span class="switch-toggle-slider"></span>
              </label>
            </div>
          </div>
          <div class="setting-row">
            <div class="setting-row-label">
              <span class="row-title">
                <span
                  transloco="settings.brightnessCct.bigscreenBeyond.forceFanSafety.title"
                ></span>
                <span
                  class="experimental-flag"
                  [tooltip]="'settings.brightnessCct.bigscreenBeyond.forceFanSafety.warning'"
                  [tooltipMode]="'right'"
                >
                  <app-icon name="warning" />
                </span>
              </span>
              <span
                transloco="settings.brightnessCct.bigscreenBeyond.forceFanSafety.description"
              ></span>
            </div>
            <div class="setting-row-action">
              <label class="switch-toggle">
                <input
                  type="checkbox"
                  [checked]="appSettings.bigscreenBeyondBrightnessFanSafety"
                  (change)="toggleBigscreenBeyondForceFanBrightnessSafety()"
                />
                <span class="switch-toggle-slider"></span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
