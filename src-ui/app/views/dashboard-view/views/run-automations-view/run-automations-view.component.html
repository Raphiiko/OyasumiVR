<div class="pane fill">
  <div class="pane-title" transloco="runAutomations.title"></div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      <div class="setting-category">
        <p transloco="runAutomations.description"></p>
        <div class="settings">
          <!-- On Sleep Enable -->
          <app-setting-row
            label="runAutomations.onSleepEnable.title"
            description="runAutomations.onSleepEnable.description"
            [value]="config.onSleepModeEnable"
            [defaultValue]="automationDefaults.RUN_AUTOMATIONS.onSleepModeEnable"
            (resetToDefault)="toggleSleepModeEnable()"
          >
            <button
              class="btn btn-icon expand-button"
              type="button"
              [class.expanded]="onSleepModeEnableExpanded"
              (click)="onSleepModeEnableExpanded = !onSleepModeEnableExpanded"
            >
              <app-icon name="chevron-down" />
            </button>
            <label class="switch-toggle">
              <input
                type="checkbox"
                [checked]="config.onSleepModeEnable"
                (change)="toggleSleepModeEnable()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </app-setting-row>

          <!-- Command input for On Sleep Enable -->
          @if (onSleepModeEnableExpanded) {
            <div class="setting-row-group" @vshrink>
              <div class="setting-row">
                <div class="setting-row-label">
                  <span transloco="runAutomations.commandsToRun"></span>
                  <span></span>
                </div>
                <div class="setting-row-action command-input">
                  <textarea
                    class="code-input"
                    appTextareaAutoResize
                    [ngModel]="onSleepModeEnableCommands"
                    (ngModelChange)="updateOnSleepModeEnable($event)"
                  ></textarea>
                  <button
                    class="btn btn-secondary"
                    type="button"
                    (click)="testCommands(onSleepModeEnableCommands)"
                    [disabled]="!onSleepModeEnableCommands.trim()"
                  >
                    <app-icon name="play" />
                    <span transloco="runAutomations.testCommands"></span>
                  </button>
                </div>
              </div>
            </div>
          }

          <!-- On Sleep Disable -->
          <app-setting-row
            label="runAutomations.onSleepDisable.title"
            description="runAutomations.onSleepDisable.description"
            [value]="config.onSleepModeDisable"
            [defaultValue]="automationDefaults.RUN_AUTOMATIONS.onSleepModeDisable"
            (resetToDefault)="toggleSleepModeDisable()"
          >
            <button
              class="btn btn-icon expand-button"
              type="button"
              [class.expanded]="onSleepModeDisableExpanded"
              (click)="onSleepModeDisableExpanded = !onSleepModeDisableExpanded"
            >
              <app-icon name="chevron-down" />
            </button>
            <label class="switch-toggle">
              <input
                type="checkbox"
                [checked]="config.onSleepModeDisable"
                (change)="toggleSleepModeDisable()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </app-setting-row>

          <!-- Command input for On Sleep Disable -->
          @if (onSleepModeDisableExpanded) {
            <div class="setting-row-group" @vshrink>
              <div class="setting-row">
                <div class="setting-row-label">
                  <span transloco="runAutomations.commandsToRun"></span>
                  <span></span>
                </div>
                <div class="setting-row-action command-input">
                  <textarea
                    class="code-input"
                    appTextareaAutoResize
                    [ngModel]="onSleepModeDisableCommands"
                    (ngModelChange)="updateOnSleepModeDisable($event)"
                  ></textarea>
                  <button
                    class="btn btn-secondary"
                    type="button"
                    (click)="testCommands(onSleepModeDisableCommands)"
                    [disabled]="!onSleepModeDisableCommands.trim()"
                  >
                    <app-icon name="play" />
                    <span transloco="runAutomations.testCommands"></span>
                  </button>
                </div>
              </div>
            </div>
          }

          <!-- On Sleep Preparation -->
          <app-setting-row
            label="runAutomations.onSleepPreparation.title"
            description="runAutomations.onSleepPreparation.description"
            [value]="config.onSleepPreparation"
            [defaultValue]="automationDefaults.RUN_AUTOMATIONS.onSleepPreparation"
            (resetToDefault)="toggleSleepPreparation()"
          >
            <button
              class="btn btn-icon expand-button"
              type="button"
              [class.expanded]="onSleepPreparationExpanded"
              (click)="onSleepPreparationExpanded = !onSleepPreparationExpanded"
            >
              <app-icon name="chevron-down" />
            </button>
            <label class="switch-toggle">
              <input
                type="checkbox"
                [checked]="config.onSleepPreparation"
                (change)="toggleSleepPreparation()"
              />
              <span class="switch-toggle-slider"></span>
            </label>
          </app-setting-row>

          <!-- Command input for On Sleep Preparation -->
          @if (onSleepPreparationExpanded) {
            <div class="setting-row-group" @vshrink>
              <div class="setting-row">
                <div class="setting-row-label">
                  <span transloco="runAutomations.commandsToRun"></span>
                  <span></span>
                </div>
                <div class="setting-row-action command-input">
                  <textarea
                    class="code-input"
                    appTextareaAutoResize
                    [ngModel]="onSleepPreparationCommands"
                    (ngModelChange)="updateOnSleepPreparation($event)"
                  ></textarea>
                  <button
                    class="btn btn-secondary"
                    type="button"
                    (click)="testCommands(onSleepPreparationCommands)"
                    [disabled]="!onSleepPreparationCommands.trim()"
                  >
                    <app-icon name="play" />
                    <span transloco="runAutomations.testCommands"></span>
                  </button>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
