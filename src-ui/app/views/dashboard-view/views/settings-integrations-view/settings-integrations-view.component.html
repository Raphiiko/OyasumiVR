<div class="pane fill">
  <div class="pane-title" transloco="settings.integrations.title"></div>
  <div class="tab-bar">
    <div class="tab" [class.active]="activeTab === 'PROVIDERS'" (click)="activeTab = 'PROVIDERS'">
      <div class="tab-label" transloco="settings.integrations.tabs.providers"></div>
    </div>
    <div class="tab" [class.active]="activeTab === 'VRCX'" (click)="activeTab = 'VRCX'">
      <div class="tab-label" transloco="settings.integrations.tabs.vrcx"></div>
    </div>
    <div class="tab" [class.active]="activeTab === 'DISCORD'" (click)="activeTab = 'DISCORD'">
      <div class="tab-label" transloco="settings.integrations.tabs.discord"></div>
    </div>
  </div>
  <div class="pane-content scroll">
    <div class="setting-view-container">
      @if (activeTab === 'PROVIDERS') {
        <app-settings-integrations-providers-tab></app-settings-integrations-providers-tab>
      }
      @if (activeTab === 'VRCX') {
        <app-settings-integrations-vrcx-tab></app-settings-integrations-vrcx-tab>
      }
      @if (activeTab === 'DISCORD') {
        <app-settings-integrations-discord-tab></app-settings-integrations-discord-tab>
      }
    </div>
  </div>
</div>
