<div class="pane modal-md" [@fadeUp]>
  <div class="pane-title" transloco="frame-limiter.add-application-modal.title"></div>
  <div class="pane-content">
    <p transloco="frame-limiter.add-application-modal.instruction"></p>
    <div class="settings">
      @for (app of appPresets; track app) {
        <div class="setting-row">
          <div class="setting-row-icon">
            @if (app.appIcon) {
              <img [src]="app.appIcon" class="app-icon" alt="{{ app.appLabel }} icon" />
            }
          </div>
          <div class="setting-row-label">
            <span>{{ app.appLabel }}</span>
            <span></span>
          </div>
          <div class="setting-row-action">
            <button
              class="btn btn-secondary"
              (click)="selectApp(app.appId)"
              transloco="frame-limiter.add-application-modal.add"
            ></button>
          </div>
        </div>
      }
    </div>
    <span [innerHTML]="'frame-limiter.add-application-modal.notListedHelp' | transloco"></span>
  </div>
  <div class="pane-actions spread">
    <button class="btn btn-secondary" (click)="close()" transloco="shared.modals.cancel"></button>
  </div>
</div>
