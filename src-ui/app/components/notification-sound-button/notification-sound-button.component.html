<div class="button-container">
  <button
    class="btn-play"
    (click)="previewSound()"
    [disabled]="(playingSound$ | async) || !soundConfig?.enabled"
  >
    <app-icon name="play" />
  </button>

  <button
    [class.unset]="!soundConfig?.sound?.name"
    [class.set]="soundConfig?.sound?.name"
    [disabled]="!soundConfig?.enabled"
    (click)="openSoundModal()"
  >
    <app-icon name="music-note" />
    <span>{{ soundConfig?.sound?.name || (label | transloco) }}</span>
    @if (
      $safeNavigationMigration(soundConfig?.volume) !== undefined &&
      $safeNavigationMigration(soundConfig?.volume) !== null
    ) {
      <span class="volume-badge">{{ soundConfig?.volume }}%</span>
    }
  </button>

  @if (toggleable) {
    <label class="switch-toggle">
      <input
        type="checkbox"
        [checked]="$safeNavigationMigration(soundConfig?.enabled)"
        (change)="toggleSound()"
      />
      <span class="switch-toggle-slider"></span>
    </label>
  }
</div>
