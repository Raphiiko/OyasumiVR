<button
  [class]="buttonClass"
  [disabled]="!canClick"
  [id]="id()"
  [style.anchor-name]="anchorName()"
  (click)="onClick()"
  (contextmenu)="onRightClick($event)"
>
  @if (!isLoading) {
    <app-icon [name]="iconName" [class.icon-mono]="iconName === 'power'" />
  }
  @if (isLoading) {
    <div class="small-spinner" [class]="spinnerClass"></div>
  }
</button>
