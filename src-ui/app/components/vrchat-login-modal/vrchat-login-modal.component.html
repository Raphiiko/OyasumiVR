<div class="pane modal" @fadeUp>
  <div class="pane-title" transloco="comp.vrchat-login-modal.title"></div>
  <div class="pane-content">
    <p class="label" transloco="comp.vrchat-login-modal.username"></p>
    <input type="text" [(ngModel)]="username" maxlength="1024" />
    <p class="label" transloco="comp.vrchat-login-modal.password"></p>
    <input type="password" [(ngModel)]="password" maxlength="1024" />
    @if (error) {
      <div class="alert error" @vshrink>
        <div class="alert-bg"></div>
        <div class="alert-icon">
          <i class="material-icons"> error </i>
        </div>
        <div class="alert-content">{{ error | transloco }}</div>
      </div>
    }
    <div class="remember-row">
      <div class="left">
        <span transloco="comp.vrchat-login-modal.rememberCredentials"></span>
      </div>
      <div class="right">
        <label class="switch-toggle">
          <input
            [disabled]="loggingIn"
            [checked]="rememberCredentials"
            (change)="toggleRememberCredentials()"
            type="checkbox"
          />
          <span class="switch-toggle-slider"></span>
        </label>
      </div>
    </div>
    <p transloco="comp.vrchat-login-modal.disclaimers.use"></p>
    <p transloco="comp.vrchat-login-modal.disclaimers.brand"></p>
    <p transloco="comp.vrchat-login-modal.disclaimers.liability"></p>
  </div>
  <div class="pane-actions stretch">
    <button
      class="btn btn-secondary"
      (click)="close()"
      [disabled]="loggingIn"
      transloco="shared.modals.cancel"
    ></button>
    <button
      class="btn btn-primary"
      [disabled]="loggingIn || !username.trim() || !password.trim()"
      (click)="login()"
    >
      @if (loggingIn) {
        <div class="small-spinner" @hshrink></div>
      }
      @if (!loggingIn) {
        <span @hshrink transloco="shared.modals.login"></span>
      }
    </button>
  </div>
</div>
