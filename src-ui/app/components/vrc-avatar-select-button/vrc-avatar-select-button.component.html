@if (!!avatar()) {
  <button class="btn-clear" @hshrink (click)="deselect()">
    <app-icon name="close" />
  </button>
}
<button class="btn-main" [class.selected]="!!avatar()" (click)="select()" @noop>
  @if (avatar(); as selectedAvatar) {
    <div @hshrink class="image">
      <img
        draggable="false"
        onerror="this.style.display = 'none'"
        loading="lazy"
        [imgSmoothLoader]="selectedAvatar.imageUrl | imageCache: 3600 * 6"
      />
    </div>
  }
  @if (avatar(); as selectedAvatar) {
    <div @hshrink class="name">
      {{ selectedAvatar.name }}
    </div>
  }
  @if (!avatar()) {
    <div @hshrink transloco="comp.vrc-avatar-select-button.select" class="name"></div>
  }
</button>
