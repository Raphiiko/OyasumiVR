<div class="wrapper">
  <button
    type="button"
    [disabled]="disabled()"
    [attr.popovertarget]="popoverId"
    [style.background-color]="cctColor()"
    (mousedown)="lift.hold()"
    (click)="raiseRow(panel)"
  >
    {{ displayValue() }}
  </button>
</div>
<div class="panel" popover [id]="popoverId" (toggle)="onToggle($event, panel)" #panel>
  <app-slider
    [min]="1000"
    [max]="10000"
    [snapValues]="[6600]"
    [snapDistance]="200"
    [value]="value()"
    [step]="50"
    (valueChange)="value.set($event)"
  ></app-slider>
</div>
