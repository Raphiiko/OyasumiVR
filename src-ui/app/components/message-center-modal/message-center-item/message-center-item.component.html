<div class="item-container">
  <div class="item-content">
    <app-icon class="icon" [ngClass]="'icon-' + message().type" [name]="getIcon()" />
    <div class="text-content">
      <span>{{ message().title | tsTranslate }}</span>
      @if (message().message) {
        <span>{{ message().message | tsTranslate }}</span>
      }
    </div>
  </div>
  @if (actions().length > 0) {
    <div class="actions">
      @for (action of actions(); track action) {
        <button
          [disabled]="busyAction() !== null"
          [class.busy]="busyAction() === action"
          (click)="runAction(action)"
        >
          @if (busyAction() === action) {
            <span class="small-spinner"></span>
          }
          {{ action.label | transloco }}
        </button>
      }
    </div>
  }
</div>
