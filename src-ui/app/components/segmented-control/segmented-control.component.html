<div class="segmented-control" role="radiogroup">
  @for (item of items(); track item.id) {
    <button
      role="radio"
      [attr.aria-checked]="item.id === selected()"
      [class.active]="item.id === selected()"
      (click)="selected.set(item.id)"
    >
      {{ item.label | transloco }}
    </button>
  }
</div>
