<div class="segmented-control" role="group" [attr.aria-label]="label() | transloco">
  @for (item of items(); track item.id) {
    <button
      [attr.aria-pressed]="item.id === selected()"
      [class.active]="item.id === selected()"
      (click)="selected.set(item.id)"
    >
      {{ item.label | transloco }}
    </button>
  }
</div>
