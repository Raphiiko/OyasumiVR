<div
  class="wrapper"
  [class.open]="open()"
  (clickOutside)="close()"
  (focusout)="onFocusOut($event, wrapper)"
  (keydown.escape)="close()"
  #wrapper
>
  <input
    type="text"
    [value]="displayValue()"
    readonly
    (mousedown)="lift.hold()"
    (focus)="openInput()"
    (click)="onFieldClick()"
    [disabled]="disabled()"
  />
  @if (open()) {
    <div class="panel" popover="manual" @panelFade #panel>
      <div class="panel-labels">
        <span>H</span>
        <span>M</span>
        <span>S</span>
      </div>
      <div class="panel-inputs">
        <input
          type="number"
          [value]="hours()"
          min="0"
          max="24"
          (input)="setHours(hourInput.value)"
          #hourInput
        />
        <input
          type="number"
          [value]="minutes()"
          min="0"
          max="60"
          (input)="setMinutes(minuteInput.value)"
          #minuteInput
        />
        <input
          type="number"
          [value]="seconds()"
          min="0"
          max="60"
          (input)="setSeconds(secondInput.value)"
          #secondInput
        />
      </div>
    </div>
  }
</div>
