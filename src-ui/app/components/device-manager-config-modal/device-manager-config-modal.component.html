<div class="pane modal modal-xl" @fadeUp>
  <div
    class="pane-title"
    transloco="device-manager.config.title"
    [translocoParams]="{ deviceName: getDisplayName() }"
  ></div>
  <div class="pane-content">
    <div class="settings">
      <!-- Nickname Section -->
      <app-setting-row
        label="device-manager.config.nickname.title"
        description="device-manager.config.nickname.description"
      >
        <div class="nickname-input">
          <div class="input-wrapper">
            <input
              type="text"
              [placeholder]="device.defaultName"
              [(ngModel)]="nickname"
              [maxlength]="32"
            />
          </div>
          @if (nickname) {
            <button
              class="btn-clear"
              (click)="clearNickname()"
              [tooltip]="'Clear nickname'"
              [tooltipMode]="'left'"
            >
              <i class="material-icons">clear</i>
            </button>
          }
        </div>
      </app-setting-row>

      <!-- Tags Section -->
      <app-setting-row
        label="device-manager.config.tags.title"
        description="device-manager.config.tags.description"
      >
        <div class="tag-selector">
          @if (availableTags.length > 0) {
            <div class="available-tags">
              @for (tag of availableTags; track trackTagBy($index, tag)) {
                <div
                  class="tag-item"
                  [class.selected]="isTagAssigned(tag)"
                  (click)="toggleTag(tag)"
                >
                  <div class="tag-color" [style.background-color]="tag.color"></div>
                  <span class="tag-name">{{ tag.name }}</span>
                  @if (isTagAssigned(tag)) {
                    <i class="material-icons tag-check">check</i>
                  }
                </div>
              }
            </div>
          }
          @if (availableTags.length === 0) {
            <div class="no-tags" transloco="device-manager.config.tags.noTags"></div>
          }
        </div>
      </app-setting-row>

      <!-- Hidden Section -->
      <app-setting-row
        label="device-manager.config.disabled.title"
        description="device-manager.config.disabled.description"
      >
        <label class="switch-toggle">
          <input type="checkbox" [checked]="device.disabled" (change)="toggleDisabled()" />
          <span class="switch-toggle-slider"></span>
        </label>
      </app-setting-row>

      <!-- Lighthouse V1 Identifier Section -->
      @if (v1LighthouseMode !== 'NONE') {
        <app-setting-row
          label="device-manager.config.v1Identifier.title"
          description="device-manager.config.v1Identifier.description"
        >
          <button
            class="btn"
            (click)="openLighthouseV1IdWizard()"
            [ngClass]="v1LighthouseMode === 'NEEDS_ID' ? 'btn-primary' : 'btn-secondary'"
          >
            {{
              (v1LighthouseMode === 'NEEDS_ID'
                ? 'device-manager.config.v1Identifier.set'
                : 'device-manager.config.v1Identifier.change'
              ) | transloco
            }}
          </button>
        </app-setting-row>
      }
    </div>
  </div>
  <div class="pane-actions spread">
    <button class="btn btn-secondary" (click)="close()" transloco="shared.modals.close"></button>
  </div>
</div>
