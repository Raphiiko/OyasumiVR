<div class="advanced-toggle">
  <div class="advanced-toggle-clickable" (click)="toggleAdvancedMode()">
    <label class="switch-toggle">
      <input type="checkbox" [checked]="advancedMode" disabled />
      <span class="switch-toggle-slider"></span>
    </label>
    @if (!advancedMode) {
      <span @hshrink transloco="brightness-automations.mode.simple"></span>
    }
    @if (advancedMode) {
      <span @hshrink transloco="brightness-automations.mode.advanced"></span>
    }
  </div>
  <app-icon name="question" class="help-icon" (click)="showModeInfoModal()" />
</div>
