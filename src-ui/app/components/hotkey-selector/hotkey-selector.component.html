@if (selected) {
  <button class="btn-clear" @hshrink (click)="deselectHotkey()">
    <app-icon name="close" />
  </button>
}
<button class="btn-main" [class.selected]="selected" (click)="selectHotkey()" @noop>
  @if (selected) {
    <div @hshrink>
      {{ hotkeyString }}
    </div>
  }
  @if (!selected) {
    <div @hshrink transloco="comp.hotkey-selector.select"></div>
  }
</button>
