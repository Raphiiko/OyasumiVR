<div class="pane modal modal-lg" [@fadeUp]>
  <div class="pane-title">
    {{ 'comp.update-modal.title' | transloco }}
  </div>
  <div class="pane-content">
    <p
      transloco="comp.update-modal.message"
      [translocoParams]="{
        newVersion: $safeNavigationMigration(update?.version),
        currentVersion: $safeNavigationMigration(update?.currentVersion),
      }"
    ></p>
    @if (FLAVOUR === 'STANDALONE') {
      <div class="steam-ad">
        <div class="steam-ad-logo">
          <img src="/assets/img/steam_icon.png" />
        </div>
        <div class="steam-ad-text" [innerHtml]="'comp.update-modal.steamAd' | transloco"></div>
      </div>
    }
  </div>
  <div class="pane-actions spread">
    <button class="btn btn-secondary" (click)="updateLater()" [disabled]="installing">
      {{ 'comp.update-modal.updateLater' | transloco }}
    </button>
    <button
      class="btn btn-primary"
      style="white-space: nowrap"
      (click)="install()"
      [disabled]="installing"
    >
      @if (installing) {
        <div class="small-spinner" @hshrink></div>
      }
      @if (!installing) {
        <span
          @hshrink
          transloco="comp.update-modal.updateNow"
          [translocoParams]="{ version: $safeNavigationMigration(update?.version) }"
        ></span>
      }
    </button>
  </div>
</div>
