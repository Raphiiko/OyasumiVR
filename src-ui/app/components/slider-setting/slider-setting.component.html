@if (showOverlay) {
  <div class="overlay-container" (mouseleave)="onOverlayLeave()" @fade>
    <div class="bg"></div>
    <div class="slider-container">
      @if (openedInDashboard) {
        <button
          type="button"
          class="btn btn-secondary btn-icon"
          [disabled]="value() <= min()"
          (click)="stepBy(-1)"
        >
          <app-icon name="minus" />
        </button>
      }
      <app-slider
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [snapDistance]="snapDistance()"
        [snapValues]="snapValues()"
        [value]="value()"
        (valueChange)="onSliderChange($event)"
        [style]="style()"
        #slider
      ></app-slider>
      @if (openedInDashboard) {
        <button
          type="button"
          class="btn btn-secondary btn-icon"
          [disabled]="value() >= max()"
          (click)="stepBy(1)"
        >
          <app-icon name="add" />
        </button>
      }
    </div>
  </div>
}
<div
  class="input-container"
  [class.has-unit]="!!unit() || !!unitIcon()"
  (mouseenter)="onMouseEnter()"
  (mousedown)="onFieldMouseDown($event)"
  [class.overlay-active]="showOverlay"
  [class.disabled]="disabled()"
>
  <input
    type="number"
    class="small"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    (input)="input$.next(inputValue.value)"
    (blur)="onInputBlur()"
    #inputValue
  />
  @if (unit() || unitIcon()) {
    <div class="unit">
      @if (unit()) {
        <span [innerHTML]="unit()"></span>
      }
      @if (unitIcon(); as icon) {
        <app-icon [name]="icon" class="icon-mono" />
      }
    </div>
  }
</div>
