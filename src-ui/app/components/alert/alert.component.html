<div class="alert-bg"></div>
<div class="alert-icon">
  @if (iconName) {
    <app-icon [name]="iconName" [style.--icon-color]="iconColor" />
  }
  <ng-content select="[alertIcon]"></ng-content>
</div>
<div class="alert-content" [ngClass]="contentClass"
  >{{ message ? (message | transloco) : '' }}<ng-content></ng-content
></div>
