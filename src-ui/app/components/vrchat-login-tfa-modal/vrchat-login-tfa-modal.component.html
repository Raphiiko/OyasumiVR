<div class="pane modal" @fadeUp>
  <div class="pane-title" transloco="comp.vrchat-login-tfa-modal.title"></div>
  <div class="pane-content">
    @if (username) {
      <p class="label"
        ><span transloco="comp.vrchat-login-tfa-modal.logginInAs"></span>&nbsp;<b>{{
          username
        }}</b></p
      >
    }
    <p class="label" transloco="comp.vrchat-login-tfa-modal.description"></p>
    <input type="text" (input)="code.next(codeInput.value)" maxlength="6" #codeInput />
    @if (error) {
      <app-alert severity="error" @vshrink>{{ error | transloco }}</app-alert>
    }
  </div>
  <div class="pane-actions">
    <button class="btn btn-secondary" (click)="cancel()" transloco="shared.modals.cancel"></button>
    <button class="btn btn-primary" (click)="login()" [disabled]="!codeValid">
      <span transloco="shared.modals.login"></span>
    </button>
  </div>
</div>
