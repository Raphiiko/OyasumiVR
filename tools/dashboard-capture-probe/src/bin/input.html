<!doctype html>
<html
  ><body style="margin: 0; background: #222">
    <button
      id="button"
      style="position: absolute; left: 40px; top: 40px; width: 200px; height: 80px"
      >Click</button
    >
    <div
      id="drag"
      style="
        position: absolute;
        left: 40px;
        top: 180px;
        width: 200px;
        height: 100px;
        background: red;
      "
      >Drag</div
    >
    <div
      id="scroll"
      style="
        position: absolute;
        left: 400px;
        top: 40px;
        width: 200px;
        height: 250px;
        overflow: auto;
      "
      ><div style="height: 1500px; background: linear-gradient(red, blue)"></div
    ></div>
    <script>
      window.state = {
        clicks: 0,
        hover: false,
        trusted: true,
        buttons: 0,
        dragX: 0,
        dragButtons: 0,
        dragReleased: false,
      };
      const button = document.getElementById('button'),
        drag = document.getElementById('drag');
      button.onmouseenter = (e) => {
        state.hover = true;
        state.trusted &&= e.isTrusted;
      };
      button.onclick = (e) => {
        state.clicks++;
        state.trusted &&= e.isTrusted;
      };
      for (const type of [
        'pointerdown',
        'pointerup',
        'pointermove',
        'mousedown',
        'mouseup',
        'mousemove',
      ])
        document.addEventListener(type, (e) => {
          state.buttons = e.buttons;
          state.trusted &&= e.isTrusted;
        });
      drag.onmousedown = () => {
        state.dragging = true;
        state.dragReleased = false;
      };
      window.addEventListener('mousemove', (e) => {
        if (state.dragging) {
          state.dragX = e.clientX;
          state.dragButtons = e.buttons;
        }
      });
      window.addEventListener('mouseup', () => {
        if (state.dragging) {
          state.dragReleased = true;
          state.dragging = false;
        }
      });
    </script></body
  ></html
>
