[package]
name = "oyasumivr-elevated-sidecar"
version = "26.8.0-beta.5"
authors = ["Raphiiko"]
license = "MIT"
edition = "2021"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dependencies]
oyasumivr-shared = { path = "../src-shared-rust" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
sentry = { version = "0.49.1", default-features = false }
nvml-wrapper = "0.12.1"
lazy_static = "1.5.0"
sysinfo = "0.39.6"
codesigned = { git = "https://github.com/rustysec/codesigned-rs" }
log = "0.4.33"
simplelog = "^0.12.2"
directories = "6.0.0"
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
tokio-stream = { version = "0.1.19", features = ["full"] }

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
]

[dependencies.tokio]
version = "1.53.1"
features = ["full"]

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Remove debug symbols
