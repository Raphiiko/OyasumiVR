@switch (overlay) {
  @case ('dashboard') {
    <app-dashboard-overlay />
  }
  @case ('notifications') {
    <app-notifications-overlay />
  }
  @case ('splash') {
    <app-splash-overlay />
  }
  @case ('tooltip') {
    <app-tooltip-overlay />
  }
  @default {
    <h1 class="placeholder">OyasumiVR Overlay UI</h1>
  }
}
