[package]
name = "oyasumivr-frame-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
oyasumivr-frame-protocol = { path = "../src-frame-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false }
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa"] }
rand = "0.10"
mdns-sd = "0.18"
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
semver = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows-core = { version = "0.62.2", default-features = false }
